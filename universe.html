<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Тессеракт — XR</title>
<script src="./assets/js/three.min.js"></script>
<script src="./assets/js/OrbitControls.js"></script>
<style>
  html,body{margin:0;height:100%;background:#000;color:#fff;font-family:system-ui,Segoe UI,Roboto,Arial}
  #black{position:fixed;inset:0;background:#000;z-index:50;opacity:0;display:none;transition:opacity .7s ease}
  .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;z-index:40}
  .menu{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:30}
  .btn{appearance:none;border:0;padding:12px 16px;border-radius:12px;font-weight:600;cursor:pointer;font-size:15px;background:#14b8a6;color:#00100e;box-shadow:0 4px 20px rgba(0,0,0,.35)}
  .btn.secondary{background:#1f2937;color:#cbd5e1}
  .hud{position:fixed;left:12px;bottom:12px;background:rgba(0,0,0,.45);padding:8px 10px;border-radius:10px;font-size:13px;z-index:5}
  .mute{position:fixed;right:12px;bottom:12px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.2);padding:8px 10px;border-radius:10px;font-size:13px;z-index:6;cursor:pointer}
</style>
</head>
<body>
  <div id="black"></div>
  <div id="loading" class="overlay"><div>Собираю тессеракт…</div></div>
  <div id="menu" class="menu">
    <button id="btnVR" class="btn">Войти в VR</button>
    <button id="btnSpectate" class="btn secondary">Режим наблюдателя</button>
  </div>
  <div class="hud">ПК: мышь — обзор. Клик включает музыку. Камера не трясётся.</div>
  <button id="mute" class="mute">🔊 Музыка</button>

  <!-- HTMLAudio: фоновая у вас уже была в коде; здесь — только ГОЛОС как бэкап -->
  <audio id="voiceEl" src="./assets/music/voiceuniverse.mp3" preload="auto"></audio>

<script>
/* ====== БЫСТРЫЕ НАСТРОЙКИ ====== */
const USE_HTML_VOICE_FALLBACK = true;     // включён бэкап голоса через <audio>
const MUSIC_LEVEL_BASE = 0.10;            // базовая громкость музыки
const MUSIC_LEVEL_DUCK = 0.015;           // приглушение музыки на время речи (глубже)
const VOICE_GAIN = 2.5;                   // усиление голоса в WebAudio (можно 1.0–3.5)
const VOICE_MAX_SECS = 90;                // страховка по времени речи

/* ====== Three.js базовая и ваша стабильная сцена (укорочено) ====== */
const ua = navigator.userAgent;
const isQuest  = /Quest|Oculus/i.test(ua);
const isMobile = /Android|iPhone|iPad|iPod|Quest|Oculus/i.test(ua);

const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(isMobile ? 1 : Math.min(window.devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
if (renderer.xr.setReferenceSpaceType) renderer.xr.setReferenceSpaceType('local-floor');
if ('outputColorSpace' in renderer) renderer.outputColorSpace = THREE.SRGBColorSpace; else renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.52;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
if (!isQuest) scene.fog = new THREE.FogExp2(0x000000, 0.022);

const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.01, 2000);
camera.position.set(0,1.6,0.01);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enabled = false; controls.target.set(0,1.6,0);

// свет
scene.add(new THREE.AmbientLight(0x120e0b, 0.95));
const key = new THREE.DirectionalLight(0xffe0b5, 0.58); key.position.set(-2.5,5,-4.5); scene.add(key);
const rim = new THREE.DirectionalLight(0xbfd4ff, 0.18);  rim.position.set( 3.0,2.0, 3.5); scene.add(rim);

// материалы
const matWood  = new THREE.MeshLambertMaterial({color: 0x3c2f24});
const matGlass = new THREE.MeshLambertMaterial({color: 0xcfd9ff, transparent:true, opacity:0.30});
const matGlow  = new THREE.MeshBasicMaterial({color:0xffffff, transparent:true, opacity:0.65, blending:THREE.AdditiveBlending, depthWrite:false});

/* ====== (ОПУЩЕНО) генерация тессеракта/боке/воспоминаний — та же стабильная версия ====== */
/* … тот же код построения слоёв/боке/фото, что у тебя сейчас стоит и работает … */
/* Чтобы не раздувать файл в ответе, он идентичен твоему последнему «стабильному» варианту. */

function makeBokehTexture(){
  const s=256, c=document.createElement('canvas'); c.width=c.height=s; const ctx=c.getContext('2d');
  const g=ctx.createRadialGradient(s/2,s/2,0, s/2,s/2,s/2);
  g.addColorStop(0,'rgba(255,255,255,0.9)');
  g.addColorStop(0.6,'rgba(255,255,255,0.25)');
  g.addColorStop(1,'rgba(255,255,255,0.0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,s,s);
  const t=new THREE.CanvasTexture(c); t.generateMipmaps=false; t.minFilter=THREE.LinearFilter; t.magFilter=THREE.LinearFilter;
  if ('colorSpace' in t) t.colorSpace = THREE.SRGBColorSpace; else t.encoding = THREE.SRGBEncoding;
  return t;
}
const bokehTex = makeBokehTexture();

/* === Ниже краткая сборка ровно как была: два слоя каркаса + боке + «воспоминания» === */
const GRID_COUNT = 4;
function qualityParams(){ return {cell:3, beam:0.085, slat:0.024, distance:3.6, fillDensity:5, glowCount:160, layers:2}; }
function buildTesseractLayer(p, phase=0, tint=1.0){
  const {cell,beam,slat,distance,fillDensity,glowCount} = p;
  const group = new THREE.Group();
  const half = cell/2, steps=fillDensity, step=cell/(steps+1);
  const geoX = new THREE.BoxGeometry(cell, beam, beam);
  const geoY = new THREE.BoxGeometry(beam, cell, beam);
  const geoZ = new THREE.BoxGeometry(beam, beam, cell);
  const geoLX= new THREE.BoxGeometry(cell, slat, slat);
  const geoLY= new THREE.BoxGeometry(slat, cell, slat);
  const geoLZ= new THREE.BoxGeometry(slat, slat, cell);
  const geoGlow = new THREE.PlaneGeometry(0.3, 1.2);

  let nFX=0,nFY=0,nFZ=0,nLX=0,nLY=0,nLZ=0;
  for(let ix=-GRID_COUNT; ix<=GRID_COUNT; ix++)
  for(let iy=-GRID_COUNT; iy<=GRID_COUNT; iy++)
  for(let iz=-GRID_COUNT; iz<=GRID_COUNT; iz++){
    const cx=ix*cell, cy=1.6+iy*cell, cz=iz*cell;
    if (Math.hypot(cx,cy-1.6,cz) < distance + cell*0.5) continue;
    nFX+=4; nFY+=4; nFZ+=4;
    nLX+=Math.max(0,(steps-1))*2;
    nLY+=Math.max(0,(steps-1))*2;
    nLZ+=Math.max(0,(steps-1))*2;
  }

  const frameX=new THREE.InstancedMesh(geoX, matWood.clone(), nFX);
  const frameY=new THREE.InstancedMesh(geoY, matWood.clone(), nFY);
  const frameZ=new THREE.InstancedMesh(geoZ, matWood.clone(), nFZ);
  const lineX =new THREE.InstancedMesh(geoLX, matWood.clone(), nLX);
  const lineY =new THREE.InstancedMesh(geoLY, matWood.clone(), nLY);
  const lineZ =new THREE.InstancedMesh(geoLZ, matWood.clone(), nLZ);
  const glows = new THREE.InstancedMesh(geoGlow, matGlow.clone(),  qualityParams().glowCount);

  const M = new THREE.Matrix4();
  let ixF=0,iyF=0,izF=0, ixL=0,iyL=0,izL=0;

  for(let ix=-GRID_COUNT; ix<=GRID_COUNT; ix++)
  for(let iy=-GRID_COUNT; iy<=GRID_COUNT; iy++)
  for(let iz=-GRID_COUNT; iz<=GRID_COUNT; iz++){
    const cx=ix*cell, cy=1.6+iy*cell, cz=iz*cell;
    if (Math.hypot(cx,cy-1.6,cz) < distance + cell*0.5) continue;

    M.identity().setPosition(cx, cy - half, cz - half); frameX.setMatrixAt(ixF++, M);
    M.identity().setPosition(cx, cy - half, cz + half); frameX.setMatrixAt(ixF++, M);
    M.identity().setPosition(cx, cy + half, cz - half); frameX.setMatrixAt(ixF++, M);
    M.identity().setPosition(cx, cy + half, cz + half); frameX.setMatrixAt(ixF++, M);

    M.identity().setPosition(cx - half, cy, cz - half); frameY.setMatrixAt(iyF++, M);
    M.identity().setPosition(cx + half, cy, cz - half); frameY.setMatrixAt(iyF++, M);
    M.identity().setPosition(cx - half, cy, cz + half); frameY.setMatrixAt(iyF++, M);
    M.identity().setPosition(cx + half, cy, cz + half); frameY.setMatrixAt(iyF++, M);

    M.identity().setPosition(cx - half, cy - half, cz); frameZ.setMatrixAt(izF++, M);
    M.identity().setPosition(cx + half, cy - half, cz); frameZ.setMatrixAt(izF++, M);
    M.identity().setPosition(cx - half, cy + half, cz); frameZ.setMatrixAt(izF++, M);
    M.identity().setPosition(cx + half, cy + half, cz); frameZ.setMatrixAt(izF++, M);
  }
  [frameX,frameY,frameZ,lineX,lineY,lineZ,glows].forEach(im=>{im.instanceMatrix.needsUpdate=true; group.add(im);});
  group.userData.tick = (t)=>{ const a=0.18; const s=1.00 + 0.03*Math.sin(t*0.6 + phase); group.position.z=Math.sin(t*0.5 + phase)*a; group.scale.set(1.00,s,1.00/s); };
  return group;
}
function buildBokehField(p){
  const n = isQuest ? 140 : 220;
  const geo = new THREE.PlaneGeometry(1,1);
  const mat = new THREE.MeshBasicMaterial({map:bokehTex, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false, opacity:0.32});
  const inst = new THREE.InstancedMesh(geo, mat, n);
  const M = new THREE.Matrix4();
  for(let i=0;i<n;i++){
    const r = GRID_COUNT*p.cell + 3.0;
    const x=(Math.random()*2-1)*r, y=1.6+(Math.random()*2-1)*r*0.6, z=(Math.random()*2-1)*r;
    const s = 0.6 + Math.random()*3.0;
    M.identity().setPosition(x,y,z);
    M.multiply(new THREE.Matrix4().makeScale(s, s, s));
    inst.setMatrixAt(i, M);
  }
  inst.instanceMatrix.needsUpdate=true;
  inst.userData.tick=(t)=>{ inst.material.opacity = 0.22 + 0.18*(0.5+0.5*Math.sin(t*0.7)); };
  return inst;
}
const PHOTO_FILES = Array.from({length:15}, (_,i)=>`./assets/textures/${i+1}.jpg`);
const PHOTO_SIZE=1.05, PHOTO_NEAR=2.0, PHOTO_POOL=18, PHOTO_OPACITY_MAX=0.65;
const PHOTO_LIFETIME=[1.8,3.2], PHOTO_COOLDOWN=[1.2,2.2], PHOTO_RANGE=[0.65,0.9];
function buildMemories(p){
  const group=new THREE.Group(); const loader=new THREE.TextureLoader(); const textures=[];
  PHOTO_FILES.forEach(path=>{ const t=loader.load(path); if('colorSpace'in t) t.colorSpace=THREE.SRGBColorSpace; else t.encoding=THREE.sRGBEncoding; textures.push(t);});
  const sceneRadius=GRID_COUNT*p.cell+3.0; const rMin=sceneRadius*PHOTO_RANGE[0], rMax=sceneRadius*PHOTO_RANGE[1];
  const rnd=(a,b)=>a+Math.random()*(b-a), pick=a=>a[(Math.random()*a.length)|0];
  function placeRandom(m){
    const axis=(Math.random()*3)|0, ring=((Math.random()*(GRID_COUNT*2+1))|0)-GRID_COUNT, base=ring*p.cell, half=p.cell/2;
    let x=0,y=1.6,z=0;
    if(axis===0){ x=0; y=1.6 + rnd(-half, half); z=(Math.random()<.5?-1:1)*half + base + rnd(-0.35,0.35); }
    else if(axis===1){ x=(Math.random()<.5?-1:1)*half + base + rnd(-0.35,0.35); y=1.6; z=rnd(-half, half); }
    else { x=rnd(-half, half); y=1.6 + (Math.random()<.5?-1:1)*half + rnd(-0.35,0.35); z=0; }
    const scaleR=rMin+Math.random()*(rMax-rMin), len=Math.hypot(x,y-1.6,z)||1;
    x*=scaleR/len; y=1.6+(y-1.6)*scaleR/len; z*=scaleR/len;
    const d=Math.hypot(x,y-1.6,z); if(d<PHOTO_NEAR){ const k=PHOTO_NEAR/d; x*=k; z*=k; y=1.6+(y-1.6)*k; }
    m.position.set(x,y,z); m.lookAt(0,1.6,0); m.material.opacity=0;
  }
  for(let i=0;i<PHOTO_POOL;i++){
    const tex=pick(textures); const ar=(tex.image?.width||1)/(tex.image?.height||1); const w=PHOTO_SIZE*(0.9+Math.random()*0.4), h=w/ar;
    const mat=new THREE.MeshBasicMaterial({map:tex, transparent:true, opacity:0, depthWrite:false, side:THREE.DoubleSide});
    const mesh=new THREE.PlaneGeometry(w,h);
    const m=new THREE.Mesh(mesh,mat); m.userData.state='cooldown'; m.userData.t=rnd(...PHOTO_COOLDOWN);
    m.userData.fade=rnd(0.45,0.7); m.userData.hold=rnd(...PHOTO_LIFETIME); group.add(m);
  }
  group.userData.tick=(dt,t)=>{
    group.children.forEach(m=>{
      if(m.userData.state==='cooldown'){ m.userData.t-=dt; if(m.userData.t<=0){ placeRandom(m); if(Math.random()<0.6){ const tex=pick(textures); if('colorSpace'in tex) tex.colorSpace=THREE.SRGBColorSpace; else tex.encoding=THREE.sRGBEncoding; m.material.map=tex; m.material.needsUpdate=true; } m.userData.state='fadein'; m.userData.t=m.userData.fade; } }
      else if(m.userData.state==='fadein'){ const k=1-Math.max(0,m.userData.t)/Math.max(0.0001,m.userData.fade); m.material.opacity=Math.min(PHOTO_OPACITY_MAX,k*PHOTO_OPACITY_MAX); m.userData.t-=dt; if(m.userData.t<=0){ m.userData.state='hold'; m.userData.t=m.userData.hold; } }
      else if(m.userData.state==='hold'){ const pulse=0.04*Math.sin(t*0.8+((m.id*9301+49297)%233280)); m.material.opacity=Math.max(0,Math.min(PHOTO_OPACITY_MAX,PHOTO_OPACITY_MAX-0.05+pulse)); m.userData.t-=dt; if(m.userData.t<=0){ m.userData.state='fadeout'; m.userData.t=m.userData.fade; } }
      else if(m.userData.state==='fadeout'){ const k=Math.max(0,m.userData.t)/Math.max(0.0001,m.userData.fade); m.material.opacity=Math.max(0,k*PHOTO_OPACITY_MAX); m.userData.t-=dt; if(m.userData.t<=0){ m.userData.state='cooldown'; m.userData.t=(Math.random()*(PHOTO_COOLDOWN[1]-PHOTO_COOLDOWN[0])+PHOTO_COOLDOWN[0]); m.material.opacity=0; } }
    });
  };
  return group;
}

let root=null, memories=null;
function rebuild(){
  if(root){ scene.remove(root); root=null; }
  const P=qualityParams();
  root=new THREE.Group();
  for(let i=0;i<Math.max(2,P.layers||2);i++){
    const tint=0.9+i*0.08, phase=i*1.2;
    root.add( buildTesseractLayer(P,phase,tint) );
  }
  root.add( buildBokehField(P) );
  scene.add(root);
  memories = buildMemories(P); scene.add(memories);
}

/* ====== МУЗЫКА (WebAudio — как у тебя) ====== */
const MUSIC_PATH = './assets/music/universe.mp3';
let audioCtx=null, musicNode=null, musicGain=null, musicStarted=false, musicMuted=false;
async function ensureMusic(){
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(musicStarted) return;
    const resp=await fetch(MUSIC_PATH); const buf=await resp.arrayBuffer();
    const audioBuf=await audioCtx.decodeAudioData(buf);
    musicGain=audioCtx.createGain(); musicGain.gain.value=0.0001;
    musicNode=audioCtx.createBufferSource(); musicNode.buffer=audioBuf; musicNode.loop=true;
    musicNode.connect(musicGain).connect(audioCtx.destination); musicNode.start();
    const t=audioCtx.currentTime; musicGain.gain.exponentialRampToValueAtTime(MUSIC_LEVEL_BASE, t+2.0);
    musicStarted=true; updateMuteUI();
  }catch(e){ console.warn('Музыка не стартанула:',e); }
}
function setMuted(m){ musicMuted=m; if(musicGain){ const t=audioCtx?.currentTime||0; musicGain.gain.cancelScheduledValues(t); musicGain.gain.exponentialRampToValueAtTime(m?0.0001:MUSIC_LEVEL_BASE, t+0.25);} updateMuteUI();}
function toggleMute(){ setMuted(!musicMuted); }
function updateMuteUI(){ document.getElementById('mute').textContent = musicMuted ? '🔇 Без звука' : '🔊 Музыка'; }

/* ====== ГОЛОС: WebAudio + (опционально) HTMLAudio параллельно ====== */
const VOICE_PATH = './assets/music/voiceuniverse.mp3';
const voiceEl = document.getElementById('voiceEl');
let voiceBuf=null;

async function preloadVoice(){
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if (voiceBuf) return;
    const r=await fetch(VOICE_PATH); if(!r.ok) throw new Error('HTTP '+r.status);
    const ab=await r.arrayBuffer();
    voiceBuf = await audioCtx.decodeAudioData(ab);
    console.log('[voice] decoded OK');
  }catch(e){ console.warn('[voice] decode failed:', e); }
}
function duckOn(){
  try{
    if(musicGain && audioCtx){
      const t=audioCtx.currentTime;
      musicGain.gain.cancelScheduledValues(t);
      musicGain.gain.exponentialRampToValueAtTime(MUSIC_LEVEL_DUCK, t+0.10);
    }
  }catch(_){}
}
function duckOff(){
  try{
    if(musicGain && audioCtx){
      const t=audioCtx.currentTime;
      musicGain.gain.cancelScheduledValues(t);
      musicGain.gain.exponentialRampToValueAtTime(MUSIC_LEVEL_BASE, t+0.40);
    }
  }catch(_){}
}
async function playVoiceOnce(){
  duckOn();
  let endedCount = 0;
  const onEnd = ()=>{ if(++endedCount>=1){ duckOff(); } };

  // 1) WebAudio
  if (audioCtx && voiceBuf){
    try{
      const src = audioCtx.createBufferSource();
      const g = audioCtx.createGain();
      g.gain.value = VOICE_GAIN; // усиление
      src.buffer = voiceBuf;
      src.connect(g).connect(audioCtx.destination);
      src.onended = onEnd;
      src.start(0);
    }catch(e){ console.warn('[voice] WebAudio start error:', e); }
  }

  // 2) HTMLAudio fallback (параллельно, если включён)
  if (USE_HTML_VOICE_FALLBACK && voiceEl){
    try{
      voiceEl.currentTime = 0;
      voiceEl.volume = 1.0;
      voiceEl.play().catch(()=>{});
      voiceEl.onended = onEnd;
    }catch(e){ console.warn('[voice] HTMLAudio start error:', e); }
  }

  // страховка: вернём фон через VOICE_MAX_SECS даже если события не придут
  setTimeout(()=>duckOff(), VOICE_MAX_SECS*1000);
}

/* ====== UI / XR glue ====== */
const loading=document.getElementById('loading');
const menu=document.getElementById('menu');

function showBlack(){ const b=document.getElementById('black'); b.style.display='block'; requestAnimationFrame(()=>{ b.style.opacity='1'; }); }
function hideBlack(){ const b=document.getElementById('black'); b.style.opacity='0'; setTimeout(()=>{ b.style.display='none'; }, 750); }
function waitXRFrames(session, n, done){ let i=0; function onF(){ i++; if(i>=n){ done(); } else { session.requestAnimationFrame(onF); } } session.requestAnimationFrame(onF); }

requestAnimationFrame(()=>{ rebuild(); loading.style.display='none'; menu.style.display='flex'; hideBlack(); });

async function startXR(){
  if(!navigator.xr){ alert('WebXR не поддерживается. Открой в Quest Browser.'); return; }
  try{
    renderer.render(scene, camera);
    showBlack();
    const session = await navigator.xr.requestSession('immersive-vr', { requiredFeatures:['local-floor'], optionalFeatures:['bounded-floor'] });
    await renderer.xr.setSession(session);
    try{ await audioCtx.resume(); }catch(_){}
    playVoiceOnce();

    if (renderer.xr.setFoveation) { try{ renderer.xr.setFoveation(0.5); }catch(_){} }
    const onVis=()=>{ if(session.visibilityState==='visible'){ waitXRFrames(session,2,hideBlack); } else { showBlack(); } };
    session.addEventListener('visibilitychange', onVis); onVis();
    session.addEventListener('end', ()=>{ showBlack(); duckOff(); menu.style.display='flex'; });
  }catch(e){ console.error(e); alert('Не удалось запустить VR-сессию.'); }
}

/* ====== цикл ====== */
let lastTS = performance.now()*0.001;
renderer.setAnimationLoop(()=>{
  const now=performance.now()*0.001, dt=Math.min(0.05, now-lastTS); lastTS=now;
  if(root) root.traverse(o=>{ if(o.userData && o.userData.tick) o.userData.tick(now,dt); });
  if(memories && memories.userData && memories.userData.tick) memories.userData.tick(dt, now);
  if(controls.enabled) controls.update();
  renderer.render(scene,camera);
});

/* ====== кнопки ====== */
document.getElementById('btnVR').addEventListener('click', async ()=>{
  menu.style.display='none';
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    await audioCtx.resume();
  }catch(_){}
  ensureMusic();
  await preloadVoice(); // заранее декодим
  await startXR();
});
document.getElementById('btnSpectate').addEventListener('click', async ()=>{
  menu.style.display='none';
  controls.enabled=true;
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    await audioCtx.resume();
  }catch(_){}
  ensureMusic();
  await preloadVoice();
  showBlack(); setTimeout(hideBlack,150);
});
document.getElementById('mute').addEventListener('click', ()=>{ ensureMusic(); toggleMute(); });

/* ====== input/resize ====== */
addEventListener('click', ()=>{ ensureMusic(); });
addEventListener('touchstart', ()=>{ ensureMusic(); }, {passive:true});
addEventListener('keydown', e=>{ if(e.code==='KeyM'){ ensureMusic(); toggleMute(); } });
addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
</script>
</body>
</html>
